# Welcome to Jekyll!

# Site settings
title: Michael Ian
email: Michael.Ian01@outlook.com
description: >-
  Native English Speaker | TESL Certified | BComm Hons (Marketing) Toronto, ON Canada
  Bilingual (English, Mandarin) | Six-Years of Work Experience

twitter_username:
github_username: michael-ian
minimal_mistakes_skin: default
search: true

# Build settings
markdown: kramdown
remote_theme: mmistakes/minimal-mistakes
permalink: /:categories/:title/
paginate: 5
paginate_path: /page:num/
timezone: # Optional: Set to something like "Asia/Shanghai"

include:
  - _pages

# Plugins
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jemoji
  - jekyll-include-cache

# Author info
author:
  name: "Michael Ian"
  avatar: "/assets/images/profile.jpg"
  bio: "Bilingual marketing, digital strategy, and creative ideas."
  links:
    - label: "Portfolio"
      icon: "fas fa-globe"
      url: "https://michael-ian.github.io"
    - label: "WeChat"
      icon: "fas fa-qrcode"
      url: "/assets/images/wechat-qr.png"

# Default settings
defaults:
  - scope:
      path: ""
    values:
      show_date: false
      last_modified_at: null
      custom_css:
        - "/assets/css/custom-background.css"
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      author_profile: true

# Archives
category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/
